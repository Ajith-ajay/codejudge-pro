spring:
  application:
    name: codejudge
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:407f3406a12d1b7d59828d17b2b73fb4b3e8316c0cb9bfcd9fcf0113c22b1016}
    expiration-ms: 900000 # 15 minutes (900000 ms)
    refresh-expiration-ms: 604800000 # 7 days (604800000 ms)
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
