spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:codejudge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    "[org.springframework.security]": INFO
